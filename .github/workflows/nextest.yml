name: nextest

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string

concurrency:
  group: tests-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTC_WRAPPER: "sccache"
  RESOLC_VERSION: 0.6.0
  DLRP_API_KEY: ${{ secrets.DLRP_API_KEY }}
  ETHERSCAN_API_KEYS: ${{ secrets.ETHERSCAN_API_KEYS }}
  SNAPSHOTS: overwrite

jobs:
  matrices:
    name: build matrices
    runs-on: ubuntu-latest
    outputs:
      test-matrix: ${{ steps.gen.outputs.test-matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Generate matrices
        id: gen
        env:
          EVENT_NAME: ${{ github.event_name }}
          PROFILE: ${{ inputs.profile }}
        run: |
          output=$(python3 .github/scripts/matrices.py)
          echo "::debug::test-matrix=$output"
          echo "test-matrix=$output" >> $GITHUB_OUTPUT

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner_label }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner_label: parity-large-new
            target: x86_64-unknown-linux-gnu
          - runner_label: macos-latest
            target: aarch64-apple-darwin
          - runner_label: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@725a8794d15fc7563f59595bd9556495c0564878
        if: runner.os == 'Linux'
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
      - uses: taiki-e/install-action@nextest
      - name: Install dependencies for building (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev unzip build-essential
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          target: ${{ matrix.target }}, wasm32-unknown-unknown
          components: rust-src
      - name: Install clang (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          brew link llvm
          echo "LLVM_CONFIG_PATH=$(brew --prefix llvm)/bin/llvm-config" >> $GITHUB_ENV
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $GITHUB_ENV
      - name: Install protobuf-compiler
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: "v0-rust-after-merge"
      - name: Build nextest archive
        run: |
          flags=""
          if [ "${{ inputs.profile }}" = "isolate" ]; then
            flags="--features=isolate-by-default"
          fi
          cargo nextest archive --archive-file nextest-archive.tar.zst $flags
      - name: Upload nextest archive
        uses: actions/upload-artifact@v4
        with:
          name: nextest-archive-${{ matrix.target }}
          path: nextest-archive.tar.zst
          retention-days: 1

  test:
    name: test ${{ matrix.name }}
    runs-on: ${{ matrix.runner_label }}
    timeout-minutes: 60
    needs: [matrices, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrices.outputs.test-matrix) }}
    env:
      ETH_RPC_URL: https://eth-mainnet.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@nextest

      - name: Download nextest archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive-${{ matrix.target }}

      - name: Setup Node.js
        if: contains(matrix.name, 'external')
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Bun
        if: contains(matrix.name, 'external') && contains(matrix.runner_label, 'ubuntu')
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install Vyper
        run: pip --version && pip install vyper==0.4.3
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
      - name: Install Resolc
        run: |
          cargo install rvm-rs
          rvm install ${{ env.RESOLC_VERSION }}
          rvm use ${{ env.RESOLC_VERSION }}
      - name: Check Resolc Version
        run: resolc --version

      - name: Forge RPC cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.foundry/cache
            ~/.config/.foundry/cache
            testdata/cache
            testdata/out
          key: ${{ runner.os }}-foundry-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-foundry-${{ matrix.name }}-

      - name: Setup Git config
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "<>"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Test
        env:
          SVM_TARGET_PLATFORM: ${{ matrix.svm_target_platform }}
          HTTP_ARCHIVE_URLS: ${{ secrets.HTTP_ARCHIVE_URLS }}
          WS_ARCHIVE_URLS: ${{ secrets.WS_ARCHIVE_URLS }}
        run: cargo nextest run --archive-file nextest-archive.tar.zst --workspace-remap . ${{ matrix.flags }}
