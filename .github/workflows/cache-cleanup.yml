name: cache-cleanup

on:
  pull_request:
    types: [closed]

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Delete PR branch caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: refs/heads/${{ github.head_ref }}
        run: |
          echo "Deleting caches for branch: $BRANCH"

          gh cache list --ref "$BRANCH" --limit 100 --json key --jq '.[].key' | \
            while read -r key; do
              [ -z "$key" ] && continue
              echo "Deleting cache: $key"
              gh cache delete "$key" --ref "$BRANCH" || true
            done

          echo "Done."
